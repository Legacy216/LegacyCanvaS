<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegacyCanvas | Banner Maker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body { 
            background-color: #0f0f0f; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        canvas { 
            border: 3px solid #333; 
            box-shadow: 0 0 20px rgba(0,255,255,0.2); 
            background-color: #1a1a1a; 
            margin-top: 20px;
        }
        .toolbar { 
            margin-bottom: 20px; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .toolbar-group {
            border: 1px solid #333;
            padding: 10px;
            border-radius: 8px;
            background: #151515;
        }
        button { 
            background: #333; 
            color: white; 
            border: 1px solid #555; 
            padding: 10px 15px; 
            cursor: pointer; 
            border-radius: 5px; 
            font-weight: bold; 
            transition: 0.2s;
        }
        button:hover { background: #555; }
        .delete-btn { background: #d9534f; }
        .delete-btn:hover { background: #c9302c; }
        .download-btn { background: #5cb85c; }
        .download-btn:hover { background: #4cae4c; }
    </style>
</head>
<body>

    <h1>LegacyCanvas Editör</h1>
    
    <div class="toolbar">
        <div class="toolbar-group">
            <button onclick="addText('Siyaset Gaming')">📝 Sunucu Adı</button>
            <button onclick="addText('IP: 213.238.173.XX')">📝 IP Adresi</button>
        </div>

        <div class="toolbar-group">
            <!-- URL'leri kendi sitene veya imgur'a yüklediğin şeffaf PNG'lerle değiştirebilirsin -->
            <button onclick="addImage('https://cdn-icons-png.flaticon.com/512/324/324128.png', 0.15)">🦅 Kartal Logosu</button>
            <button onclick="addImage('https://cdn-icons-png.flaticon.com/512/3132/3132791.png', 0.15)">⚡ Şimşek</button>
            <button onclick="addImage('https://cdn-icons-png.flaticon.com/512/3074/3074064.png', 0.2)">🔫 CS Karakteri</button>
        </div>

        <div class="toolbar-group">
            <button onclick="changeBackground('#001f3f')">❄️ Kış Arka Plan</button>
            <button onclick="changeBackground('#8b0000')">🔴 Kan Kırmızı</button>
            <button onclick="changeBackground('#1a1a1a')">⚫ Koyu Tema</button>
        </div>

        <div class="toolbar-group">
            <button class="delete-btn" onclick="deleteSelected()">🗑️ Seçiliyi Sil</button>
            <button class="download-btn" onclick="downloadBanner()">💾 Banneri İndir</button>
        </div>
    </div>

    <!-- TS3 / CS 1.6 için standart banner alanı -->
    <canvas id="bannerCanvas" width="800" height="200"></canvas>
    
    <p style="color: #aaa; margin-top: 15px;">İpucu: Objeleri seçip "Delete" tuşuyla silebilir, köşelerinden boyutlandırabilirsin.</p>

    <script>
        const canvas = new fabric.Canvas('bannerCanvas');

        // Klavyeden Delete tuşu ile silme özelliği
        window.addEventListener('keydown', function(e) {
            if (e.key === 'Delete') {
                deleteSelected();
            }
        });

        function addText(textValue) {
            const text = new fabric.IText(textValue, {
                left: 300,
                top: 80,
                fontFamily: 'Impact',
                fill: '#ffffff',
                fontSize: 35,
                shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.8)', blur: 5, offsetX: 3, offsetY: 3 })
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        // Yeni Eklenen: Görsel/Logo Yükleme Fonksiyonu
        function addImage(url, scale) {
            fabric.Image.fromURL(url, function(img) {
                img.scale(scale);
                img.set({ 
                    left: 50, 
                    top: 20,
                    // Görsellere hafif bir parlama efekti verelim
                    shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.5)', blur: 10, offsetX: 0, offsetY: 0 })
                });
                canvas.add(img);
                canvas.setActiveObject(img);
            }, { crossOrigin: 'anonymous' }); // İndirme hatası vermemesi için hayati ayar
        }

        function changeBackground(color) {
            canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas));
        }

        function deleteSelected() {
            const activeObject = canvas.getActiveObject();
            if (activeObject) {
                canvas.remove(activeObject);
            }
        }

        function downloadBanner() {
            const dataURL = canvas.toDataURL({ format: 'png', quality: 1.0 });
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'LegacyCanvas-Banner.png';
            link.click();
        }
    </script>
</body>
</html>
