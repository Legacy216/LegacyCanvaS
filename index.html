<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegacyCanvas | Profesyonel Tasarım Platformu</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;600;800&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0d0f12; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* NAVBAR */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #15181e; padding: 12px 30px; border-bottom: 1px solid #232730; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; color: #fff; cursor: pointer; letter-spacing: -0.5px; }
        .logo span { color: #00d2ff; }
        .nav-search { display: flex; align-items: center; background: #0d0f12; border: 1px solid #232730; border-radius: 8px; padding: 4px 15px; width: 380px; }
        .nav-search input { background: transparent; border: none; color: white; width: 100%; padding: 8px; outline: none; font-size: 13px; }
        .user-actions { display: flex; gap: 12px; align-items: center; }
        
        /* BUTONLAR */
        .btn { padding: 9px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; font-size: 13px; }
        .btn-primary { background: linear-gradient(90deg, #00d2ff 0%, #0072ff 100%); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-pro { background: linear-gradient(90deg, #f5af19 0%, #e65c00 100%); color: #fff; box-shadow: 0 4px 15px rgba(230, 92, 0, 0.3); }
        .btn-dark { background: #232730; color: #ccc; border: 1px solid #323744; }
        .btn-dark:hover { background: #323744; color: white; }

        /* GALERİ VE SOL MENÜ */
        .dashboard { display: flex; height: 100%; flex: 1; overflow: hidden; }
        .sidebar-filters { width: 240px; background: #15181e; padding: 20px; border-right: 1px solid #232730; overflow-y: auto; }
        .filter-title { font-size: 11px; color: #656b79; text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 8px 0; font-weight: 700; }
        .filter-btn { display: block; width: 100%; text-align: left; background: transparent; border: none; color: #9aa0ac; padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .filter-btn:hover, .filter-btn.active { background: #232730; color: #00d2ff; }
        
        .gallery-area { flex: 1; padding: 25px 35px; overflow-y: auto; background: #0d0f12; }
        .gallery-header { font-size: 22px; font-weight: 800; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 22px; padding-bottom: 60px; }
        
        /* ŞABLON KARTLARI */
        .template-card { background: #15181e; border: 1px solid #232730; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; transition: 0.25s ease-in-out; display: flex; flex-direction: column; }
        .template-card:hover { transform: translateY(-4px); border-color: #00d2ff; box-shadow: 0 8px 24px rgba(0,210,255,0.15); }
        .template-img-container { height: 160px; width: 100%; background: #000; position: relative; overflow: hidden; }
        .template-img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
        .template-card:hover .template-img-container img { transform: scale(1.05); }
        .template-info { padding: 14px; background: #15181e; }
        .template-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; color: #f0f2f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .template-category { font-size: 12px; color: #717786; }
        .pro-badge-card { position: absolute; top: 10px; right: 10px; background: linear-gradient(90deg, #f5af19, #e65c00); color: #fff; font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 4px; z-index: 2; }
        .animated-badge { position: absolute; top: 10px; left: 10px; background: #eb3b5a; color: white; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px; z-index: 2; }

        /* EDİTÖR EKRANI */
        .editor-container { display: none; height: 100%; flex: 1; position: relative; }
        .editor-sidebar { width: 72px; background: #15181e; display: flex; flex-direction: column; align-items: center; padding-top: 15px; border-right: 1px solid #232730; }
        .tool-icon { width: 54px; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #828997; cursor: pointer; font-size: 10px; margin-bottom: 8px; border-radius: 8px; transition: 0.2s; }
        .tool-icon:hover { color: white; background: #232730; }
        .editor-panel { width: 260px; background: #191c24; border-right: 1px solid #232730; padding: 18px; display: none; flex-direction: column; gap: 10px; overflow-y: auto; }
        .canvas-wrapper { flex: 1; background: #090a0d; display: flex; justify-content: center; align-items: center; overflow: auto; position: relative; padding: 40px; }
        canvas { box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .editor-topbar { position: absolute; top: 15px; right: 25px; display: flex; gap: 10px; z-index: 10; }

        /* MODALLAR */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(6px); }
        .modal-content { background: #15181e; padding: 30px; border-radius: 12px; width: 380px; border: 1px solid #232730; }
        .modal-content input { width: 100%; padding: 11px; margin-bottom: 12px; background: #0d0f12; border: 1px solid #2e3340; color: white; border-radius: 6px; font-size: 13px; outline: none; }
        .modal-content input:focus { border-color: #00d2ff; }
        .cc-row { display: flex; gap: 10px; }
        .loader { display: none; border: 3px solid #232730; border-top: 3px solid #00d2ff; border-radius: 50%; width: 22px; height: 22px; animation: spin 0.8s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo" onclick="showDashboard()">Legacy<span>Canvas</span></div>
        <div class="nav-search">
            <input type="text" placeholder="Şablonlarda ara (Legacy Cafe, Kartal, Adana Kebap...)" onkeyup="searchTemplates(this.value)">
        </div>
        <div class="user-actions" id="userPanel"></div>
    </div>

    <!-- EKRAN 1: GALERİ (Dashboard) -->
    <div class="dashboard" id="dashboardScreen">
        <div class="sidebar-filters">
            <button class="btn btn-primary" style="width: 100%; margin-bottom: 15px;" onclick="openBlankEditor()">+ Boş Tasarım Aç</button>
            
            <div class="filter-title">Kategoriler</div>
            <button class="filter-btn active" onclick="filterGallery('Tümü')">🌟 Tümü</button>
            <button class="filter-btn" onclick="filterGallery('Oyunlar')">🎮 Oyun & Sunucu</button>
            <button class="filter-btn" onclick="filterGallery('Kafe & Restoran')">☕ Kafe & Kebapçı</button>
            <button class="filter-btn" onclick="filterGallery('Düğün & Davetiye')">💍 Düğün & Davetiye</button>
            <button class="filter-btn" onclick="filterGallery('Sosyal Medya')">📱 Sosyal Medya</button>
        </div>
        
        <div class="gallery-area">
            <div class="gallery-header">
                <span id="galleryTitle">Tüm Hazır Şablonlar</span>
            </div>
            <div class="template-grid" id="templateGrid"></div>
        </div>
    </div>

    <!-- EKRAN 2: GELİŞMİŞ EDİTÖR -->
    <div class="editor-container" id="editorScreen">
        <div class="editor-sidebar">
            <div class="tool-icon" onclick="togglePanel('textPanel')"><span style="font-size:18px; margin-bottom:4px;">📝</span>Metin</div>
            <div class="tool-icon" onclick="togglePanel('mediaPanel')"><span style="font-size:18px; margin-bottom:4px;">🖼️</span>Görsel</div>
            <div class="tool-icon" onclick="togglePanel('bgPanel')"><span style="font-size:18px; margin-bottom:4px;">🎨</span>Arka Plan</div>
        </div>

        <div class="editor-panel" id="textPanel">
            <h3 style="font-size: 13px; color:#717786;">Yazı Ekle</h3>
            <button class="btn btn-dark" onclick="addCustomText('BAŞLIK', 42, 'Impact', '#ffffff')">Oyun Başlığı (Impact)</button>
            <button class="btn btn-dark" onclick="addCustomText('ÖZEL MENÜ', 36, 'Montserrat', '#ffcc00')">Kafe/Fiyat Başlığı</button>
            <button class="btn btn-dark" onclick="addCustomText('Düğün Davetiyesi', 32, 'Playfair Display', '#f39c12')">Davetiye Fontu</button>
        </div>
        
        <div class="editor-panel" id="mediaPanel">
            <h3 style="font-size: 13px; color:#717786;">Özel Logo Yükle</h3>
            <button class="btn btn-primary" onclick="document.getElementById('imgUpload').click()">📁 Bilgisayardan Seç</button>
            <input type="file" id="imgUpload" style="display: none;" accept="image/*">
            <h3 style="font-size: 13px; color:#717786; margin-top:15px;">Özel Amblemler</h3>
            <div style="display:flex; gap:10px;">
                <img src="https://cdn-icons-png.flaticon.com/512/324/324128.png" width="45" style="cursor:pointer; background:#232730; padding:5px; border-radius:6px;" onclick="addOverlayImage(this.src, 0.2)">
                <img src="https://cdn-icons-png.flaticon.com/512/3132/3132791.png" width="45" style="cursor:pointer; background:#232730; padding:5px; border-radius:6px;" onclick="addOverlayImage(this.src, 0.2)">
            </div>
        </div>

        <div class="editor-panel" id="bgPanel">
            <h3 style="font-size: 13px; color:#717786;">Arka Plan Rengi</h3>
            <div style="display:flex; gap:8px; margin-bottom:15px;">
                <div style="width:28px; height:28px; background:#000; cursor:pointer; border-radius:4px; border:1px solid #444;" onclick="changeBgColor('#000000')"></div>
                <div style="width:28px; height:28px; background:#1a0000; cursor:pointer; border-radius:4px;" onclick="changeBgColor('#1a0000')"></div>
                <div style="width:28px; height:28px; background:#0b192c; cursor:pointer; border-radius:4px;" onclick="changeBgColor('#0b192c')"></div>
                <div style="width:28px; height:28px; background:#2c1810; cursor:pointer; border-radius:4px;" onclick="changeBgColor('#2c1810')"></div>
            </div>
            <button class="btn btn-dark" onclick="document.getElementById('bgUpload').click()">🖼️ Arka Plan Fotoğrafı Yükle</button>
            <input type="file" id="bgUpload" style="display: none;" accept="image/*">
        </div>

        <div class="canvas-wrapper">
            <div class="editor-topbar">
                <button class="btn btn-dark" onclick="showDashboard()">⬅️ Şablonlara Dön</button>
                <button class="btn btn-dark" onclick="deleteSelected()">🗑️ Sil</button>
                <button class="btn btn-primary" onclick="downloadBanner()">💾 Resmi İndir</button>
            </div>
            <canvas id="bannerCanvas"></canvas>
        </div>
    </div>

    <!-- MODAL: GİRİŞ -->
    <div id="loginModal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <h2 style="margin-bottom:6px;">Giriş Yap</h2>
            <p style="color:#717786; font-size:13px; margin-bottom:18px;">LegacyCanvas hesabınıza bağlanın.</p>
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <button class="btn btn-primary" style="width:100%;" onclick="login()">Giriş Yap</button>
            <button class="btn btn-dark" style="width:100%; margin-top:8px;" onclick="closeModal('loginModal')">Kapat</button>
        </div>
    </div>

    <!-- MODAL: KREDİ KARTI / SANAL POS -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <div style="text-align: center; margin-bottom: 18px;">
                <h2 style="color: #f5af19;">PRO Tasarım Kilidi</h2>
                <p style="color:#888; font-size:12px; margin-top:4px;">Bu şablon ve tüm Pro kütüphane için ödeme yapın.</p>
                <h1 style="margin-top: 8px; font-size: 26px;">300 TL</h1>
            </div>
            
            <label style="font-size: 11px; color: #888;">Kart Sahibi</label>
            <input type="text" id="ccName" placeholder="Ad Soyad">
            
            <label style="font-size: 11px; color: #888;">Kart Numarası</label>
            <input type="text" id="ccNum" placeholder="0000 0000 0000 0000" maxlength="19">
            
            <div class="cc-row">
                <div style="flex: 1;">
                    <label style="font-size: 11px; color: #888;">SKT</label>
                    <input type="text" id="ccExp" placeholder="AA/YY" maxlength="5">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 11px; color: #888;">CVC</label>
                    <input type="text" id="ccCvc" placeholder="000" maxlength="3">
                </div>
            </div>

            <div id="paymentLoader" class="loader"></div>
            <button id="payBtn" class="btn btn-pro" style="width:100%; padding:12px; margin-top: 6px;" onclick="processPayment()">300 TL Öde ve Aç</button>
            <button class="btn btn-dark" style="width:100%; margin-top:8px;" onclick="closeModal('paymentModal')">İptal</button>
        </div>
    </div>

        // --- KULLANICI / VERİTABANI YÖNETİMİ ---
        let user = JSON.parse(localStorage.getItem('legacyUser')) || { isLoggedIn: false, username: '', isPro: false };
        let currentFilter = 'Tümü';

        function saveUser() { localStorage.setItem('legacyUser', JSON.stringify(user)); updateNavbar(); }

        function updateNavbar() {
            const panel = document.getElementById('userPanel');
            if (user.isLoggedIn) {
                panel.innerHTML = `
                    <div style="font-size:13px;">Giriş yapıldı: <b>${user.username}</b></div>
                    ${user.isPro ? '<span style="background:linear-gradient(90deg,#f5af19,#e65c00); color:#fff; padding:4px 8px; border-radius:4px; font-weight:800; font-size:11px;">PRO HESAP</span>' : '<button class="btn btn-pro" onclick="openModal(\'paymentModal\')">⭐ PRO Al (300 TL)</button>'}
                    <button class="btn btn-dark" onclick="logout()">Çıkış</button>
                `;
            } else {
                panel.innerHTML = `<button class="btn btn-primary" onclick="openModal('loginModal')">Giriş Yap</button>`;
            }
        }

        function login() { 
            const n = document.getElementById('username').value.trim(); 
            if(n.length < 2) return alert("Geçerli isim girin!"); 
            user.isLoggedIn = true; user.username = n; 
            saveUser(); closeModal('loginModal'); 
        }

        function logout() { user = { isLoggedIn: false, username: '', isPro: false }; saveUser(); showDashboard(); }

        // --- GALERİ RENDERLAMA ---
        function renderGallery(filterCat, searchTerm = '') {
            const grid = document.getElementById('templateGrid');
            grid.innerHTML = '';
            document.getElementById('galleryTitle').innerText = filterCat === 'Tümü' ? 'Tüm Hazır Şablonlar' : filterCat + ' Şablonları';

            let list = filterCat === 'Tümü' ? templates : templates.filter(t => t.cat === filterCat);
            if (searchTerm) {
                list = list.filter(t => t.name.toLowerCase().includes(searchTerm.toLowerCase()));
            }

            list.forEach(temp => {
                const card = document.createElement('div');
                card.className = 'template-card';
                card.onclick = () => handleTemplateClick(temp);
                card.innerHTML = `
                    ${temp.pro ? '<div class="pro-badge-card">PRO</div>' : ''}
                    ${temp.anim ? '<div class="animated-badge">🎬 HAREKETLİ</div>' : ''}
                    <div class="template-img-container">
                        <img src="${temp.thumb}" alt="${temp.name}">
                    </div>
                    <div class="template-info">
                        <div class="template-title">${temp.name}</div>
                        <div class="template-category">${temp.cat} • ${temp.w}x${temp.h}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterGallery(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderGallery(category);
        }

        function searchTemplates(val) { renderGallery(currentFilter, val); }

        function showDashboard() {
            document.getElementById('dashboardScreen').style.display = 'flex';
            document.getElementById('editorScreen').style.display = 'none';
        }

        function handleTemplateClick(temp) {
            if (temp.pro && !user.isPro) {
                return openModal('paymentModal');
            }
            openEditorWithTemplate(temp);
        }

        // --- GELİŞMİŞ EDİTÖR (Fabric.js Katman Yükleyici) ---
        let canvas;
        function initCanvas() {
            if(!canvas) canvas = new fabric.Canvas('bannerCanvas', { preserveObjectStacking: true });
        }

        function openBlankEditor() {
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('editorScreen').style.display = 'flex';
            initCanvas();
            canvas.clear();
            canvas.setWidth(800);
            canvas.setHeight(400);
            canvas.setBackgroundColor('#15181e', canvas.renderAll.bind(canvas));
        }

        function openEditorWithTemplate(temp) {
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('editorScreen').style.display = 'flex';
            initCanvas();
            canvas.clear();
            canvas.setWidth(temp.w);
            canvas.setHeight(temp.h);

            // 1. Arka plan görselini tuvale tam sığdırarak yükle
            fabric.Image.fromURL(temp.bgImg, function(img) {
                canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                    scaleX: canvas.width / img.width,
                    scaleY: canvas.height / img.height
                });

                // 2. Varsa Şablon İkonunu Ekle (Örn: Kartal)
                if (temp.overlayImg) {
                    fabric.Image.fromURL(temp.overlayImg, function(oImg) {
                        oImg.scale(0.25);
                        oImg.set({ left: 30, top: (canvas.height/2) - (oImg.getScaledHeight()/2) });
                        canvas.add(oImg);
                    }, { crossOrigin: 'anonymous' });
                }

                // 3. Başlık Metni Katmanı
                const titleText = new fabric.IText(temp.title, {
                    left: temp.overlayImg ? 180 : (canvas.width / 2),
                    top: (canvas.height / 2) - 40,
                    fontFamily: temp.titleFont,
                    fill: temp.titleColor,
                    fontSize: temp.h > 400 ? 55 : 38,
                    fontWeight: 'bold',
                    originX: temp.overlayImg ? 'left' : 'center',
                    shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.85)', blur: 10, offsetX: 2, offsetY: 2 })
                });
                canvas.add(titleText);

                // 4. Alt Başlık / Fiyat / IP Katmanı
                const subText = new fabric.IText(temp.subtitle, {
                    left: temp.overlayImg ? 180 : (canvas.width / 2),
                    top: (canvas.height / 2) + 15,
                    fontFamily: 'Inter',
                    fill: temp.subColor,
                    fontSize: temp.h > 400 ? 24 : 15,
                    originX: temp.overlayImg ? 'left' : 'center',
                    shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.9)', blur: 8, offsetX: 1, offsetY: 1 })
                });
                canvas.add(subText);
                canvas.setActiveObject(titleText);

            }, { crossOrigin: 'anonymous' });
        }

        function togglePanel(panelId) {
            document.querySelectorAll('.editor-panel').forEach(p => p.style.display = 'none');
            document.getElementById(panelId).style.display = 'flex';
        }

        function addCustomText(txt, size, font, color) {
            const t = new fabric.IText(txt, {
                left: canvas.width / 2, top: canvas.height / 2,
                fontFamily: font, fill: color, fontSize: size,
                originX: 'center', originY: 'center',
                shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.7)', blur: 6 })
            });
            canvas.add(t); canvas.setActiveObject(t);
        }

        function addOverlayImage(url, scale) {
            fabric.Image.fromURL(url, (img) => {
                img.scale(scale);
                img.set({ left: 50, top: 50 });
                canvas.add(img); canvas.setActiveObject(img);
            }, { crossOrigin: 'anonymous' });
        }

        function changeBgColor(color) {
            canvas.backgroundImage = null;
            canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas));
        }

        // Dosya Yükleme Olayları
        document.getElementById('imgUpload').addEventListener('change', function(e) {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                fabric.Image.fromURL(ev.target.result, (img) => {
                    img.scaleToWidth(200); canvas.add(img); canvas.setActiveObject(img);
                });
            };
            r.readAsDataURL(f); e.target.value = '';
        });

        document.getElementById('bgUpload').addEventListener('change', function(e) {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                fabric.Image.fromURL(ev.target.result, (img) => {
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                        scaleX: canvas.width / img.width, scaleY: canvas.height / img.height
                    });
                });
            };
            r.readAsDataURL(f); e.target.value = '';
        });

        window.addEventListener('keydown', (e) => { if (e.key === 'Delete') deleteSelected(); });
        function deleteSelected() { const o = canvas.getActiveObject(); if(o) canvas.remove(o); }
        function downloadBanner() {
            const a = document.createElement('a');
            a.href = canvas.toDataURL('png');
            a.download = 'LegacyCanvas-Tasarim.png';
            a.click();
        }

        // --- SANAL POS SİMÜLASYONU ---
        document.getElementById('ccNum').addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
        });
        document.getElementById('ccExp').addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{2})/, '$1/').trim().substring(0,5);
        });

        function processPayment() {
            if(!user.isLoggedIn) { closeModal('paymentModal'); return openModal('loginModal'); }
            const num = document.getElementById('ccNum').value;
            if(num.length < 19) return alert("Kart numarasını eksiksiz girin.");

            document.getElementById('payBtn').style.display = 'none';
            document.getElementById('paymentLoader').style.display = 'block';

            setTimeout(() => {
                document.getElementById('paymentLoader').style.display = 'none';
                document.getElementById('payBtn').style.display = 'block';
                user.isPro = true;
                saveUser();
                closeModal('paymentModal');
                alert("Ödeme alındı! Tüm şablonların kilidi açıldı.");
                renderGallery(currentFilter);
            }, 1500);
        }

        // Modal Yönetimi
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Başlangıç Yüklemesi
        updateNavbar();
        renderGallery('Tümü');
    </script>
</body>
</html>
