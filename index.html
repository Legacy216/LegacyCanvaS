<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegacyCanvas | Banner Maker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body { 
            background-color: #0f0f0f; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        canvas { 
            border: 3px solid #333; 
            box-shadow: 0 0 20px rgba(0,255,255,0.2); 
            background-color: #1a1a1a; 
            margin-top: 20px;
        }
        .toolbar { 
            margin-bottom: 20px; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .toolbar-group {
            border: 1px solid #333;
            padding: 10px;
            border-radius: 8px;
            background: #151515;
            display: flex;
            gap: 5px;
            align-items: center;
        }
        button { 
            background: #333; 
            color: white; 
            border: 1px solid #555; 
            padding: 10px 15px; 
            cursor: pointer; 
            border-radius: 5px; 
            font-weight: bold; 
            transition: 0.2s;
        }
        button:hover { background: #555; }
        .upload-btn { background: #337ab7; border-color: #2e6da4; }
        .upload-btn:hover { background: #286090; }
        .delete-btn { background: #d9534f; }
        .delete-btn:hover { background: #c9302c; }
        .download-btn { background: #5cb85c; }
        .download-btn:hover { background: #4cae4c; }
        
        /* Çirkin dosya seçme inputlarını gizliyoruz */
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <h1>LegacyCanvas Editör</h1>
    
    <div class="toolbar">
        <div class="toolbar-group">
            <button onclick="addText('Siyaset Gaming')">📝 Sunucu Adı</button>
            <button onclick="addText('IP: 213.238.173.XX')">📝 IP Adresi</button>
        </div>

        <div class="toolbar-group">
            <button onclick="addImage('https://cdn-icons-png.flaticon.com/512/324/324128.png', 0.15)">🦅 Kartal</button>
            <button onclick="addImage('https://cdn-icons-png.flaticon.com/512/3074/3074064.png', 0.2)">🔫 CS Karakteri</button>
            
            <!-- Bilgisayardan Görsel Yükleme -->
            <button class="upload-btn" onclick="document.getElementById('imageUploader').click()">📁 Kendi Logonu Yükle</button>
            <input type="file" id="imageUploader" accept="image/*">
        </div>

        <div class="toolbar-group">
            <button onclick="changeBackground('#001f3f')">❄️ Kış</button>
            <button onclick="changeBackground('#8b0000')">🔴 Savaş</button>
            
            <!-- Bilgisayardan Arka Plan Yükleme -->
            <button class="upload-btn" onclick="document.getElementById('bgUploader').click()">🖼️ Arka Plan Yükle</button>
            <input type="file" id="bgUploader" accept="image/*">
        </div>

        <div class="toolbar-group">
            <button class="delete-btn" onclick="deleteSelected()">🗑️ Seçiliyi Sil</button>
            <button class="download-btn" onclick="downloadBanner()">💾 Banneri İndir</button>
        </div>
    </div>

    <canvas id="bannerCanvas" width="800" height="200"></canvas>
    
    <p style="color: #aaa; margin-top: 15px;">İpucu: Objeleri seçip "Delete" tuşuyla silebilir, köşelerinden boyutlandırabilirsin.</p>

    <script>
        const canvas = new fabric.Canvas('bannerCanvas');

        // Klavyeden Delete tuşu ile silme
        window.addEventListener('keydown', function(e) {
            if (e.key === 'Delete') {
                deleteSelected();
            }
        });

        function addText(textValue) {
            const text = new fabric.IText(textValue, {
                left: 300,
                top: 80,
                fontFamily: 'Impact',
                fill: '#ffffff',
                fontSize: 35,
                shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.8)', blur: 5, offsetX: 3, offsetY: 3 })
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        // İnternetten Hazır Görsel Ekleme
        function addImage(url, scale) {
            fabric.Image.fromURL(url, function(img) {
                img.scale(scale);
                img.set({ left: 50, top: 20 });
                canvas.add(img);
                canvas.setActiveObject(img);
            }, { crossOrigin: 'anonymous' });
        }

        // --- YENİ: Bilgisayardan Obje/Logo Yükleme ---
        document.getElementById('imageUploader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const imgObj = new Image();
                imgObj.src = event.target.result;
                imgObj.onload = function() {
                    const img = new fabric.Image(imgObj);
                    // Resim çok büyükse tuvale sığacak şekilde küçült
                    if (img.width > 300) {
                        img.scaleToWidth(200);
                    }
                    img.set({ left: 100, top: 50 });
                    canvas.add(img);
                    canvas.setActiveObject(img);
                }
            };
            reader.readAsDataURL(file);
            e.target.value = ''; // Aynı dosyayı tekrar seçebilmek için inputu sıfırla
        });

        // Düz Renk Arka Plan
        function changeBackground(color) {
            canvas.backgroundImage = null; // Varsa eski resmi kaldır
            canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas));
        }

        // --- YENİ: Bilgisayardan Arka Plan Resmi Yükleme ---
        document.getElementById('bgUploader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            
            reader.onload = function(event) {
                fabric.Image.fromURL(event.target.result, function(img) {
                    // Yüklenen resmi 800x200 canvas boyutuna tam sığdır
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                        scaleX: canvas.width / img.width,
                        scaleY: canvas.height / img.height
                    });
                });
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        function deleteSelected() {
            const activeObject = canvas.getActiveObject();
            if (activeObject) {
                canvas.remove(activeObject);
            }
        }

        function downloadBanner() {
            const dataURL = canvas.toDataURL({ format: 'png', quality: 1.0 });
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'LegacyCanvas-Banner.png';
            link.click();
        }
    </script>
</body>
</html>
