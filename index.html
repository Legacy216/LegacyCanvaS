        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0b0c10; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* NAVBAR */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #13151b; padding: 12px 30px; border-bottom: 1px solid #1f232d; z-index: 100; }
        .logo { font-size: 22px; font-weight: 900; color: #fff; cursor: pointer; letter-spacing: -0.5px; }
        .logo span { color: #00e5ff; }
        .nav-search { display: flex; align-items: center; background: #0b0c10; border: 1px solid #1f232d; border-radius: 8px; padding: 4px 15px; width: 360px; }
        .nav-search input { background: transparent; border: none; color: white; width: 100%; padding: 8px; outline: none; font-size: 13px; }
        .user-actions { display: flex; gap: 12px; align-items: center; }
        
        /* BUTONLAR */
        .btn { padding: 9px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; font-size: 13px; }
        .btn-primary { background: linear-gradient(90deg, #00e5ff 0%, #0072ff 100%); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-pro { background: linear-gradient(90deg, #ffb300 0%, #ff6f00 100%); color: #000; font-weight: 800; }
        .btn-dark { background: #1f232d; color: #ccc; border: 1px solid #2d3240; }
        .btn-dark:hover { background: #2d3240; color: white; }

        /* GALERİ VE YAN MENÜ */
        .dashboard { display: flex; height: 100%; flex: 1; overflow: hidden; }
        .sidebar-filters { width: 250px; background: #13151b; padding: 20px; border-right: 1px solid #1f232d; overflow-y: auto; }
        .filter-title { font-size: 11px; color: #5a6170; text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 8px 0; font-weight: 800; }
        .filter-btn { display: block; width: 100%; text-align: left; background: transparent; border: none; color: #8e95a5; padding: 11px 14px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .filter-btn:hover, .filter-btn.active { background: #1f232d; color: #00e5ff; }
        
        .gallery-area { flex: 1; padding: 25px 35px; overflow-y: auto; background: #0b0c10; }
        .gallery-header { font-size: 20px; font-weight: 800; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; padding-bottom: 80px; }
        
        /* ŞABLON KARTLARI */
        .template-card { background: #13151b; border: 1px solid #1f232d; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; transition: 0.25s; display: flex; flex-direction: column; }
        .template-card:hover { transform: translateY(-4px); border-color: #00e5ff; box-shadow: 0 10px 25px rgba(0,229,255,0.12); }
        .card-preview { height: 150px; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px; text-align: center; position: relative; }
        .template-info { padding: 14px; background: #13151b; border-top: 1px solid #1f232d; }
        .template-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; color: #f0f2f5; }
        .template-category { font-size: 12px; color: #626978; }
        .badge-pro { position: absolute; top: 10px; right: 10px; background: #ffb300; color: #000; font-size: 10px; font-weight: 900; padding: 3px 7px; border-radius: 4px; }

        /* EDİTÖR */
        .editor-container { display: none; height: 100%; flex: 1; position: relative; }
        .editor-sidebar { width: 70px; background: #13151b; display: flex; flex-direction: column; align-items: center; padding-top: 15px; border-right: 1px solid #1f232d; }
        .tool-icon { width: 50px; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #767d8e; cursor: pointer; font-size: 10px; margin-bottom: 10px; border-radius: 8px; }
        .tool-icon:hover { color: white; background: #1f232d; }
        .editor-panel { width: 270px; background: #181a22; border-right: 1px solid #1f232d; padding: 18px; display: none; flex-direction: column; gap: 10px; overflow-y: auto; }
        .canvas-wrapper { flex: 1; background: #07080a; display: flex; justify-content: center; align-items: center; overflow: auto; position: relative; padding: 40px; }
        canvas { box-shadow: 0 15px 50px rgba(0,0,0,0.9); }
        .editor-topbar { position: absolute; top: 15px; right: 25px; display: flex; gap: 10px; z-index: 10; }

        /* MODAL */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #13151b; padding: 30px; border-radius: 12px; width: 380px; border: 1px solid #1f232d; }
        .modal-content input { width: 100%; padding: 11px; margin-bottom: 12px; background: #0b0c10; border: 1px solid #2d3240; color: white; border-radius: 6px; font-size: 13px; outline: none; }

        <div class="editor-panel" id="textPanel">
            <h3 style="font-size: 13px; color:#5a6170;">Yazı Ekle</h3>
            <button class="btn btn-dark" onclick="addText('YENİ BAŞLIK', 40, 'Teko', '#00e5ff')">Oyun/Espor Başlığı (Teko)</button>
            <button class="btn btn-dark" onclick="addText('ÖZEL MENÜ', 32, 'Montserrat', '#ffb300')">Restoran/Fiyat Başlığı</button>
            <button class="btn btn-dark" onclick="addText('Düğün Töreni', 30, 'Cinzel', '#e0cfb3')">Lüks Davetiye Başlığı</button>
        </div>

        <div class="editor-panel" id="shapePanel">
            <h3 style="font-size: 13px; color:#5a6170;">Grafik & Rozet Ekle</h3>
            <button class="btn btn-dark" onclick="addBadge('İNDİRİM %30', '#ff1744')">Fırsat Rozeti Ekle</button>
            <button class="btn btn-dark" onclick="addBorder()">Lüks Altın Çerçeve Ekle</button>
        </div>

        <div class="editor-panel" id="bgPanel">
            <h3 style="font-size: 13px; color:#5a6170;">Arka Plan Rengi</h3>
            <div style="display:flex; gap:8px; margin-bottom: 12px;">
                <div style="width:28px; height:28px; background:#0a0a0d; cursor:pointer; border-radius:4px; border:1px solid #333;" onclick="changeBg('#0a0a0d')"></div>
                <div style="width:28px; height:28px; background:#1b0000; cursor:pointer; border-radius:4px;" onclick="changeBg('#1b0000')"></div>
                <div style="width:28px; height:28px; background:#001220; cursor:pointer; border-radius:4px;" onclick="changeBg('#001220')"></div>
                <div style="width:28px; height:28px; background:#1e140a; cursor:pointer; border-radius:4px;" onclick="changeBg('#1e140a')"></div>
            </div>
            <button class="btn btn-dark" onclick="document.getElementById('bgUpload').click()">🖼️ Kendi Resmini Yükle</button>
            <input type="file" id="bgUpload" style="display: none;" accept="image/*">
        </div>

        <div class="canvas-wrapper">
            <div class="editor-topbar">
                <button class="btn btn-dark" onclick="showDashboard()">⬅️ Şablonlara Dön</button>
                <button class="btn btn-dark" onclick="deleteSelected()">🗑️ Sil</button>
                <button class="btn btn-primary" onclick="downloadBanner()">💾 Resmi İndir</button>

        // --- KULLANICI YÖNETİMİ ---
        let user = JSON.parse(localStorage.getItem('legacyUser')) || { isLoggedIn: false, username: '', isPro: false };
        let currentFilter = 'Tümü';

        function saveUser() { localStorage.setItem('legacyUser', JSON.stringify(user)); updateNavbar(); }

        function updateNavbar() {
            const panel = document.getElementById('userPanel');
            if (user.isLoggedIn) {
                panel.innerHTML = `
                    <div style="font-size:13px;">Giriş: <b>${user.username}</b></div>
                    ${user.isPro ? '<span style="background:#ffb300; color:#000; padding:4px 8px; border-radius:4px; font-weight:900; font-size:11px;">PRO HESAP</span>' : '<button class="btn btn-pro" onclick="openModal(\'paymentModal\')">⭐ PRO Al (300 TL)</button>'}
                    <button class="btn btn-dark" onclick="logout()">Çıkış</button>
                `;
            } else {
                panel.innerHTML = `<button class="btn btn-primary" onclick="quickLogin()">Giriş Yap</button>`;
            }
        }
        function quickLogin() {
            const n = prompt("Kullanıcı adınızı girin:");
            if(n && n.trim().length > 1) { user.isLoggedIn = true; user.username = n.trim(); saveUser(); }
        }
        function logout() { user = { isLoggedIn: false, username: '', isPro: false }; saveUser(); showDashboard(); }

        // --- GALERİ RENDERLAMA ---
        function renderGallery(filterCat, search = '') {
            const grid = document.getElementById('templateGrid');
            grid.innerHTML = '';
            document.getElementById('galleryTitle').innerText = filterCat === 'Tümü' ? 'Tüm Profesyonel Tasarımlar (24)' : filterCat + ' Tasarımları';

            let list = filterCat === 'Tümü' ? templates : templates.filter(t => t.cat === filterCat);
            if (search) {
                list = list.filter(t => (t.name + ' ' + t.sub).toLowerCase().includes(search.toLowerCase()));
            }

            list.forEach(t => {
                const card = document.createElement('div');
                card.className = 'template-card';
                card.onclick = () => handleTemplateClick(t);
                card.innerHTML = `
                    ${t.pro ? '<div class="badge-pro">PRO</div>' : ''}
                    <div class="card-preview" style="background: ${t.previewBg}">
                        <div style="font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 0.5px;">${t.title}</div>
                        <div style="font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 5px;">${t.sub}</div>
                    </div>
                    <div class="template-info">
                        <div class="template-title">${t.name}</div>
                        <div class="template-category">${t.cat} • ${t.w}x${t.h}px</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterGallery(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderGallery(category);
        }

        function searchTemplates(val) { renderGallery(currentFilter, val); }

        function showDashboard() {
            document.getElementById('dashboardScreen').style.display = 'flex';
            document.getElementById('editorScreen').style.display = 'none';
        }

        function handleTemplateClick(t) {
            if (t.pro && !user.isPro) return openModal('paymentModal');
            loadTemplateToCanvas(t);
        }

        // --- FABRIC.JS KATMANLI ŞABLON RENDERLAYICI ---
        let canvas;
        function initCanvas() {
            if (!canvas) canvas = new fabric.Canvas('bannerCanvas', { preserveObjectStacking: true });
        }

        function openBlankEditor() {
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('editorScreen').style.display = 'flex';
            initCanvas();
            canvas.clear();
            canvas.setWidth(800);
            canvas.setHeight(400);
            canvas.setBackgroundColor('#0a0d14', canvas.renderAll.bind(canvas));
        }

        function loadTemplateToCanvas(t) {
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('editorScreen').style.display = 'flex';
            initCanvas();
            canvas.clear();
            canvas.setWidth(t.w);
            canvas.setHeight(t.h);

            t.layers.forEach(l => {
                if (l.type === 'rect') {
                    const rect = new fabric.Rect({
                        left: l.left || 0, top: l.top || 0,
                        width: l.w, height: l.h,
                        fill: l.fill || 'transparent',
                        stroke: l.stroke || null,
                        strokeWidth: l.strokeWidth || 0,
                        opacity: l.opacity !== undefined ? l.opacity : 1,
                        selectable: false
                    });
                    canvas.add(rect);
                } else if (l.type === 'text') {
                    const txt = new fabric.IText(l.text, {
                        left: l.left, top: l.top,
                        fontFamily: l.font || 'Montserrat',
                        fontSize: l.size,
                        fill: l.fill,
                        fontWeight: 'bold',
                        originX: l.originX || 'left',
                        textAlign: l.textAlign || 'left',
                        shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.8)', blur: 8, offsetX: 2, offsetY: 2 })
                    });
                    canvas.add(txt);
                } else if (l.type === 'badge') {
                    const bg = new fabric.Rect({
                        width: l.w, height: l.h, rx: 6, ry: 6, fill: l.fill
                    });
                    const bt = new fabric.IText(l.text, {
                        fontSize: 14, fontFamily: 'Montserrat', fill: '#ffffff', fontWeight: 'bold',
                        originX: 'center', originY: 'center', left: l.w / 2, top: l.h / 2
                    });
                    const group = new fabric.Group([bg, bt], { left: l.left, top: l.top });
                    canvas.add(group);
                }
            });

            canvas.renderAll();
        }

        function togglePanel(panelId) {
            document.querySelectorAll('.editor-panel').forEach(p => p.style.display = 'none');
            document.getElementById(panelId).style.display = 'flex';
        }

        function addText(txt, size, font, color) {
            const t = new fabric.IText(txt, {
                left: canvas.width / 2, top: canvas.height / 2,
                fontFamily: font, fill: color, fontSize: size, originX: 'center', originY: 'center',
                shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.7)', blur: 6 })
            });
            canvas.add(t); canvas.setActiveObject(t);
        }

        function addBadge(txt, color) {
            const bg = new fabric.Rect({ width: 160, height: 40, rx: 5, ry: 5, fill: color });
            const bt = new fabric.IText(txt, { fontSize: 14, fontFamily: 'Montserrat', fill: '#ffffff', fontWeight: 'bold', originX: 'center', originY: 'center', left: 80, top: 20 });
            const g = new fabric.Group([bg, bt], { left: 50, top: 50 });
            canvas.add(g); canvas.setActiveObject(g);
        }

        function addBorder() {
            const b = new fabric.Rect({
                left: 15, top: 15, width: canvas.width - 30, height: canvas.height - 30,
                fill: 'transparent', stroke: '#d4af37', strokeWidth: 2
            });
            canvas.add(b);
        }

        function changeBg(color) {
            canvas.backgroundImage = null;
            canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas));
        }

        document.getElementById('bgUpload').addEventListener('change', function(e) {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                fabric.Image.fromURL(ev.target.result, (img) => {
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                        scaleX: canvas.width / img.width, scaleY: canvas.height / img.height
                    });
                });
            };
            r.readAsDataURL(f); e.target.value = '';
        });

        window.addEventListener('keydown', (e) => { if (e.key === 'Delete') deleteSelected(); });
        function deleteSelected() { const o = canvas.getActiveObject(); if(o) canvas.remove(o); }
        function downloadBanner() {
            const a = document.createElement('a');
            a.href = canvas.toDataURL('png');
            a.download = 'LegacyCanvas-Pro.png';
            a.click();
        }

        // Ödeme
        function processPayment() {
            const n = document.getElementById('ccNum').value;
            if (n.length < 10) return alert("Kart numarasını girin.");
            user.isPro = true; saveUser(); closeModal('paymentModal');
            alert("Tebrikler! PRO kütüphanenin kilidi açıldı.");
            renderGallery(currentFilter);
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Başlat
        updateNavbar();
        renderGallery('Tümü');
    </script>
