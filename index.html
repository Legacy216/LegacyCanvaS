<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegacyCanvas | Banner Maker</title>
    <!-- Fabric.js Kütüphanesini doğrudan internetten çekiyoruz -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body { 
            background-color: #0f0f0f; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        canvas { 
            border: 3px solid #333; 
            box-shadow: 0 0 20px rgba(0,255,255,0.2); 
            background-color: #1a1a1a; 
            margin-top: 20px;
        }
        .toolbar { margin-bottom: 20px; }
        button { 
            background: #333; 
            color: white; 
            border: 1px solid #555; 
            padding: 10px 15px; 
            margin: 5px; 
            cursor: pointer; 
            border-radius: 5px; 
            font-weight: bold; 
        }
        button:hover { background: #444; }
        .delete-btn { background: #d9534f; }
        .download-btn { background: #5cb85c; }
    </style>
</head>
<body>

    <h1>LegacyCanvas Editör</h1>
    
    <div class="toolbar">
        <button onclick="addText('Siyaset Gaming - CS 1.6')">➕ Siyaset Gaming Ekle</button>
        <button onclick="addText('LegacyClan')">➕ LegacyClan Ekle</button>
        <button onclick="changeBackground('#001f3f')">❄️ Kış Teması</button>
        <button onclick="changeBackground('#8b0000')">🔴 Savaş Teması</button>
        <button class="delete-btn" onclick="deleteSelected()">🗑️ Seçiliyi Sil</button>
        <button class="download-btn" onclick="downloadBanner()">💾 Banneri İndir</button>
    </div>

    <!-- TS3 ve CS 1.6 MOTD için uygun standart boyut -->
    <canvas id="bannerCanvas" width="800" height="200"></canvas>
    
    <p style="color: #aaa; margin-top: 15px;">İpucu: Yazılara çift tıklayarak düzenleyebilir, köşelerinden tutup büyütebilirsin.</p>

    <script>
        // Canvas'ı başlat
        const canvas = new fabric.Canvas('bannerCanvas');

        // Metin Ekleme Fonksiyonu
        function addText(textValue) {
            const text = new fabric.IText(textValue, {
                left: 50,
                top: 50,
                fontFamily: 'Impact',
                fill: '#ffffff',
                fontSize: 40,
                shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.8)', blur: 5, offsetX: 3, offsetY: 3 })
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        // Arka Plan Rengini Değiştirme
        function changeBackground(color) {
            canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas));
        }

        // Seçili Objeyi Silme (Klavyedeki Delete tuşunu da bağlayabiliriz)
        function deleteSelected() {
            const activeObject = canvas.getActiveObject();
            if (activeObject) {
                canvas.remove(activeObject);
            }
        }

        // Tasarımı PNG olarak indirme
        function downloadBanner() {
            const dataURL = canvas.toDataURL({ format: 'png', quality: 1.0 });
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'LegacyCanvas.png';
            link.click();
        }
    </script>
</body>
</html>
